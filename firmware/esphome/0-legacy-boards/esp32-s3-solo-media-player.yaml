substitutions:
  # Override in your own config with: ota_password: !secret ota_password
  ota_password: ""
  name: esp32-s3-test
  friendly_name: ESP32-S3-Solo Media Player

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: Sonocotta.ESP32-S3-Solo
    version: '1.0'
  name_add_mac_suffix: false
  on_boot:
    priority: 800
    then:
    - media_player.volume_set:
        id: esp32s3solo
        volume: 50%

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    advanced:
      # Keep only the generic SPI flash driver. ESP-IDF otherwise links one
      # driver per vendor (gd, issi, mxic, winbond, boya, th) and uses just the
      # one matching the flash ID, so the rest are idle: ~1KB IRAM on the ESP32,
      # ~2-3KB on the ESP32-S3, plus 124B DRAM each. Safe here because every
      # board runs flash in dio mode, where the generic driver handles any chip;
      # the vendor drivers only matter for qio/qout or flash above 16MB.
      flash_chip: generic


# Enable logging
logger:
  level: INFO
  
# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome
    id: ota_esphome
    password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "$name Hotspot"
    password: !secret ap_password

captive_portal:

psram:
  mode: octal
  speed: 80MHz
  
i2s_audio:
  i2s_lrclk_pin: GPIO16
  i2s_bclk_pin: GPIO10

media_player:
  - platform: i2s_audio
    id: esp32s3solo
    name: ${friendly_name}
    dac_type: external
    i2s_dout_pin: GPIO44
    mode: stereo