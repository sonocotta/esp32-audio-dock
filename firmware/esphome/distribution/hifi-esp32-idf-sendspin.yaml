# ============================================================
# HiFi-ESP32 - Sendspin Configuration (Factory-shippable copy)
# ============================================================
# ESP32 audio board with PCM5100 DAC, I2S output
# Configured with Sendspin for synchronized multi-room audio
#
# This is a factory-shippable copy of
# ../1-hifi-esp32/hifi-esp32-idf-sendspin.yaml, kept in sync by hand.
# It differs from the dev config in the ways a binary that ships to
# strangers must:
#   - No `!secret` Wi-Fi credentials or OTA password baked in (those
#     only exist on the developer's own machine) — Wi-Fi is instead
#     provisioned per-unit via Improv (see the sibling .factory.yaml).
#   - `esphome.ota` is provided by the .factory.yaml overlay
#     (platform: http_request) instead of platform: esphome.
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: hifi-esp32
  friendly_name: HIFI-ESP32
  task_stack_in_psram: "false"

  # ===== Board-Specific Pinouts =====
  # I2S Audio (PCM5100 DAC)
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22

  # RGB LED
  rgb_led_pin: GPIO12

  # IR Receiver
  ir_rx_pin: GPIO39

  # Ethernet (W5500)
  eth_cs_pin: GPIO05
  eth_interrupt_pin: GPIO35
  eth_reset_pin: GPIO14

  # SPI pins
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19

  # Display control pins
  display_cs_pin: GPIO15
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32

  # ESP32 optimal settings for Sendspin
  media_source_buffer_size: 100000

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0

esp32:
  id: esp32_id
  variant: esp32
  flash_size: 8MB
  flash_mode: dio
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      # Keep only the generic SPI flash driver. ESP-IDF otherwise links one
      # driver per vendor (gd, issi, mxic, winbond, boya, th) and uses just the
      # one matching the flash ID, so the rest are idle: ~1KB IRAM on the ESP32,
      # ~2-3KB on the ESP32-S3, plus 124B DRAM each. Safe here because every
      # board runs flash in dio mode, where the generic driver handles any chip;
      # the vendor drivers only matter for qio/qout or flash above 16MB.
      flash_chip: generic
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
    sdkconfig_options:
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  # Compiled with DEBUG so the "Log Level" select can raise it at runtime;
  # starts at INFO on every boot.
  level: DEBUG
  initial_level: INFO

api:
  # Don't reboot when no Home Assistant client is connected: players used
  # only with Music Assistant (Sendspin) never have one.
  reboot_timeout: 0s

# Wi-Fi credentials are never baked in: this image ships with no
# configured network and is provisioned per-unit over Improv
# (BLE + Serial), wired up in the .factory.yaml overlay.
wifi:
  id: wifi_id

psram:
  speed: 80MHz

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    files:
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/sendspin.yaml
      - firmware/esphome/packages/sendspin-addon-esp32.yaml

      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      # Per-interface monitoring is added by the factory overlay that knows which
      # interface this image actually ships with: monitoring-wifi.yaml in
      # hifi-esp32-idf-sendspin.factory.yaml, monitoring-eth.yaml in
      # hifi-esp32-idf-sendspin-eth.factory.yaml.
      # Keeping it out of here is what lets the Ethernet image `wifi: !remove`
      # without stranding a wifi_signal sensor that then fails validation.
