# ============================================================
# HiFi-ESP32-S3-Input - Sendspin Source (Factory-shippable copy)
# ============================================================
# ESP32-S3 audio board with a PCM1863 stereo ADC, streaming its line
# input into Music Assistant through the Sendspin source role.
#
# This is a factory-shippable copy of
# ../11-hifi-esp32-input/hifi-esp32-s3-input-idf-sendspin.yaml, kept in
# sync by hand. It differs from the dev config in the ways a binary
# that ships to strangers must:
#   - No `!secret` Wi-Fi credentials or OTA password baked in (those
#     only exist on the developer's own machine) - Wi-Fi is instead
#     provisioned per-unit via Improv (see the sibling .factory.yaml).
#   - `esphome.ota` is provided by the .factory.yaml overlay
#     (platform: http_request) instead of platform: esphome.
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
#
# !! This board is a first prototype. Expect rough edges. !!
# ============================================================

substitutions:
  name: hifi-esp32s3-input
  friendly_name: HiFi-ESP32-S3-Input
  task_stack_in_psram: "true"

  # ===== Board-Specific Pinouts =====
  # I2S audio pins. Same three pins as HiFi-ESP32-S3-Plus, except the data
  # line runs the other way: the ADC drives it and the ESP32 listens.
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_din_pin: GPIO16

  # I2C pins for ADC control
  i2c_sda_pin: GPIO42
  i2c_scl_pin: GPIO41
  pcm1863_i2c_address: "0x4A"

  # Boot default for the analog input mux:
  #   VIN2 = minijack, VIN1 = coax pair
  pcm1863_input: VIN2
  pcm1863_mic_gain: 0db

  # RGB LED
  rgb_led_pin: GPIO09

  # IR Receiver
  ir_rx_pin: GPIO07

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  name_add_mac_suffix: false

esp32:
  variant: ESP32S3
  flash_size: 8MB
  flash_mode: dio
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      # Keep only the generic SPI flash driver. ESP-IDF otherwise links one
      # driver per vendor (gd, issi, mxic, winbond, boya, th) and uses just the
      # one matching the flash ID, so the rest are idle: ~1KB IRAM on the ESP32,
      # ~2-3KB on the ESP32-S3, plus 124B DRAM each. Safe here because every
      # board runs flash in dio mode, where the generic driver handles any chip;
      # the vendor drivers only matter for qio/qout or flash above 16MB.
      flash_chip: generic
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  # Compiled with DEBUG so the "Log Level" select can raise it at runtime;
  # starts at INFO on every boot.
  level: DEBUG
  initial_level: INFO

api:
  # Don't reboot when no Home Assistant client is connected: a source used
  # only with Music Assistant (Sendspin) never has one.
  reboot_timeout: 0s

# Wi-Fi credentials are never baked in: this image ships with no
# configured network and is provisioned per-unit over Improv
# (BLE + Serial), wired up in the .factory.yaml overlay.
wifi:
  id: wifi_id

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    files:
      - firmware/esphome/packages/adc-pcm1863.yaml
      - firmware/esphome/packages/audio-input.yaml
      - firmware/esphome/packages/sendspin-source.yaml

      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
