# ============================================================
# Louder-ESP32-S3-Plus - Sendspin Configuration (Factory-shippable copy)
# ============================================================
# ESP32-S3 audio board with TAS5825M DAC (I2C+I2S) with built-in DSP
# Configured with Sendspin for synchronized multi-room audio
#
# This is a factory-shippable copy of
# ../7-louder-esp32-plus/louder-esp32-s3-plus-idf-sendspin.yaml,
# kept in sync by hand. It differs from the dev config in the ways
# a binary that ships to strangers must:
#   - No `!secret` Wi-Fi credentials or OTA password baked in (those
#     only exist on the developer's own machine) — Wi-Fi is instead
#     provisioned per-unit via Improv (see the sibling .factory.yaml).
#   - `esphome.ota` is provided by the .factory.yaml overlay
#     (platform: http_request) instead of platform: esphome.
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: louder-esp32s3-plus
  friendly_name: Louder-ESP32-S3-Plus
  task_stack_in_psram: "true"

  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16

  # TAS5825M
  tas58xx_variant: TAS5825M
  tas58xx_enable_pin: GPIO17
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9

  # RGB LED
  rgb_led_pin: GPIO21

  # IR receiver
  ir_rx_pin: GPIO07

  # SPI pins (for display)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13

  # Display control pins
  display_cs_pin: GPIO47
  display_dc_pin: GPIO38
  display_reset_pin: GPIO48

  # Ethernet pins (if using ethernet instead of wifi)
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

logger:
  level: DEBUG

api:

# Wi-Fi credentials are never baked in: this image ships with no
# configured network and is provisioned per-unit over Improv
# (BLE + Serial), wired up in the .factory.yaml overlay.
wifi:
  id: wifi_id

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    files:
      # Option A: TAS58xx configured with ganged 15-band EQ
      - firmware/esphome/packages/dac-tas58xx.yaml
      # Option B: TAS58xx configured with individual 15-band EQ per channel
      # - firmware/esphome/packages/dac-tas58xx-biamp.yaml
      # Option C: TAS58xx configured with bi-amp mode, with filters applied to both channels (HF or LF)
      # - firmware/esphome/packages/dac-tas58xx-presets.yaml

      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/sendspin.yaml
      - firmware/esphome/packages/sendspin-audio-addon-external-dac.yaml
      - firmware/esphome/packages/sendspin-addon-dac-enable.yaml
      - firmware/esphome/packages/sendspin-addon-tas58xx.yaml

      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
