# ============================================================
# Monitoring - System Metrics and Diagnostics
# ============================================================
# Uptime, temperature, memory and log-level diagnostics.
# WiFi-specific sensors (wifi_signal, wifi_info) are in
# monitoring-wifi.yaml — include that package when using WiFi.
#
# Most of these entities only matter while debugging, so they
# are compiled in but `disabled_by_default`: Home Assistant adds
# them disabled and records nothing for them. To debug, enable
# the ones you need on the device page in Home Assistant
# (Settings → Devices → <device> → Diagnostic). No rebuild is
# needed, so this works on the factory firmware too.
#
# Two ways to get DEBUG logs from Home Assistant:
#   - "Log Level" select: changes the level right away, until the
#     next reboot (then back to the device config's `initial_level`,
#     INFO).
#   - "Debug Logging" switch: DEBUG right away AND from early in
#     every boot, until it is turned off again. Use this when the
#     problem shows up during startup.
#
# The log level can only be raised as far as the level the
# firmware was compiled with (`logger: level:`), which is why the
# device configs compile with DEBUG and start at INFO.
#
# Requires substitutions:
#   - friendly_name
# ============================================================

debug:
  update_interval: 30s

# Time source for the Uptime timestamp below. Home Assistant is
# the only consumer of that sensor, so its clock is enough.
time:
  - platform: homeassistant
    id: monitoring_time

select:
  # Runtime log level. Options go up to the compiled `logger: level:`.
  - platform: logger
    name: "Log Level"

switch:
  # Persistent DEBUG logging. The state is stored on the device; a template
  # switch restores at setup priority HARDWARE-2 and runs its turn_on_action
  # when it restores ON, so DEBUG is set before Wi-Fi, audio and Sendspin
  # start, without needing `esphome: on_boot` (which the factory configs
  # already define as a mapping). Turning it off returns to INFO.
  - platform: template
    id: debug_logging
    name: "Debug Logging"
    icon: mdi:bug
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.set_level: DEBUG
    turn_off_action:
      - logger.set_level: INFO
    # Write the new state to flash now rather than within the next
    # minute, so it survives a power cut right after switching.
    on_turn_on:
      - lambda: global_preferences->sync();
    on_turn_off:
      - lambda: global_preferences->sync();

sensor:
  # Boot time as a timestamp: published once after boot (and when
  # the clock syncs), instead of a new value every minute.
  - platform: uptime
    type: timestamp
    time_id: monitoring_time
    name: "${friendly_name} Uptime"

  - platform: internal_temperature
    name: "${friendly_name} CPU Temperature"
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

  - platform: debug
    # Internal (non-PSRAM) heap. "Free PSRAM" below does not cover it, and this is the
    # heap the Wi-Fi and Ethernet drivers must take their DMA-capable buffers from, so
    # it is what explains "no mem for receive buffer" style failures — especially on
    # plain ESP32 boards running both network stacks at once (see network: priority:).
    free:
      name: "Heap Free"
      disabled_by_default: true
    min_free:
      name: "Heap Min Free"
      disabled_by_default: true
    fragmentation:
      name: "Heap Fragmentation"
      disabled_by_default: true
    # Largest single free block. Worth enabling when a buffer allocation fails while
    # "Heap Free" still looks healthy — that gap is fragmentation.
    block:
      name: "Heap Max Block"
      disabled_by_default: true
    loop_time:
      name: "Loop Time"
      disabled_by_default: true
    psram:
      name: "Free PSRAM"
      disabled_by_default: true
    cpu_frequency:
      name: "CPU Frequency"
      disabled_by_default: true

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
      disabled_by_default: true
    # Set once per boot; useful when reporting an issue, so kept enabled.
    reset_reason:
      name: "Reset Reason"

# No "Status" binary sensor: over the native API Home Assistant
# already marks the device unavailable when it disconnects.

button:
  - platform: restart
    id: restart_btn
    name: "${friendly_name} REBOOT"
