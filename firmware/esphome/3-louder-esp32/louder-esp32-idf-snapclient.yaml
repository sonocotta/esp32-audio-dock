# ============================================================
# Louder-ESP32 - Snapclient Configuration
# ============================================================
# ESP32 audio board with TAS5805M DAC (I2C+I2S) with built-in DSP
# Configured as a Snapcast client for synchronized audio
# There are two implementations available:
# 1) Basic snapclient without DSP controls (c-MM original port)
# 2) snapclient with added DSP controls (farmed-switch fork of c-MM port)
#     Frequencies: 40, 50, 60, 70, 80, 90, 100, 110, 120, 130,
#                 140, 200, 315, 500, 800, 1250, 2000, 5000 Hz
#     Range: -15dB to +15dB per band
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: louder-esp32
  friendly_name: Louder-ESP32
  task_stack_in_psram: "false" 

  # ===== Optional Hardware Feature Toggles =====
  # Accepts true/false quoted or bare; anything that is not "true"
  # (case-insensitive) disables the feature. A disabled feature is not
  # merged at all, so it claims no GPIO and costs no flash.
  # See firmware/esphome/README.md for the full notes.
  enable_led: "true"    # WS2812 RGB LED on rgb_led_pin
  enable_ir: "true"     # IR receiver on ir_rx_pin
  enable_lan: "true"    # W5500 Ethernet module on the SPI pins
  enable_oled: "false"  # SH1106 OLED on the SPI pins

  # The git ref the feature packages below are pulled from. Set this to the
  # same ref you pinned this file at, so a pinned config gets matching
  # packages instead of whatever happens to be on main.
  sonocotta_ref: main

  # ===== Board-Specific Pinouts =====
  # I2S Audio
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22
  
  # TAS5805M
  tas58xx_variant: TAS5805M
  tas58xx_enable_pin: GPIO33
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO27

  # ===== DAC Overrides (optional) =====
  # tas58xx_dac_mode: PBTL 
  # tas58xx_mixer_mode: MONO
  # tas58xx_analog_gain: 0db
  # tas58xx_volume_max: 0dB
  # tas58xx_volume_min: -60dB
  tas58xx_refresh_eq: MANUAL
  tas58xx_dac_restore_mode: ALWAYS_OFF

  # RGB LED
  rgb_led_pin: GPIO12
  
  # IR Receiver
  ir_rx_pin: GPIO39

  # Supply voltage sense (10:1 divider, ADC1_CH0), populated from rev H9
  power_adc_pin: GPIO36

  # SPI pins (for display)
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19

  # Ethernet (W5500)
  eth_cs_pin: GPIO05
  eth_interrupt_pin: GPIO35
  eth_reset_pin: GPIO14
  
  # Display control pins
  display_cs_pin: GPIO15
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32

  # ===== Snapcast Server Configuration =====
  snapcast_server_ip: "192.168.1.49"
  snapcast_server_port: "1704"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  flash_size: 8MB
  flash_mode: dio
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      # Keep only the generic SPI flash driver. ESP-IDF otherwise links one
      # driver per vendor (gd, issi, mxic, winbond, boya, th) and uses just the
      # one matching the flash ID, so the rest are idle: ~1KB IRAM on the ESP32,
      # ~2-3KB on the ESP32-S3, plus 124B DRAM each. Safe here because every
      # board runs flash in dio mode, where the generic driver handles any chip;
      # the vendor drivers only matter for qio/qout or flash above 16MB.
      flash_chip: generic
      minimum_chip_revision: "3.1" 
      sram1_as_iram: true
    sdkconfig_options:
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  # Compiled with DEBUG so the "Log Level" select can raise it at runtime;
  # starts at INFO on every boot.
  level: DEBUG
  initial_level: INFO

api:
  # Don't reboot when no Home Assistant client is connected: players used
  # only with Music Assistant (Sendspin) never have one.
  reboot_timeout: 0s

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  speed: 80MHz

network:
  enable_ipv6: true
  # With `enable_lan: true` both `wifi:` and `ethernet:` are configured. On the ESP32 family the two
  # stacks can run side by side, but then the priority list is mandatory (ESPHome 2026.8.1+).
  # It decides which interface is brought up first, whose IP is reported, and which one
  # carries the default route. Failover is automatic: unplug the cable and traffic moves
  # to Wi-Fi, plug it back in and Ethernet takes over again.
  # With Ethernet off there is no `ethernet:` component to name here,
  # so the list collapses to Wi-Fi only.
  priority: "${ ['ethernet', 'wifi'] if enable_lan|string|lower == 'true' else ['wifi'] }"

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: ${sonocotta_ref}
    files:
      # Option A: TAS58xx configured with ganged 15-band EQ
      - firmware/esphome/packages/dac-tas58xx.yaml
      # Option B: TAS58xx configured with individual 15-band EQ per channel
      # - firmware/esphome/packages/dac-tas58xx-biamp.yaml
      # Option C: TAS58xx configured with bi-amp mode, with filters applied to both channels (HF or LF)
      # - firmware/esphome/packages/dac-tas58xx-presets.yaml

      - firmware/esphome/packages/${ 'light' if enable_led|string|lower == 'true' else 'empty' }.yaml
      - firmware/esphome/packages/${ 'ir-receiver' if enable_ir|string|lower == 'true' else 'empty' }.yaml
      - firmware/esphome/packages/monitoring.yaml
      # Optional supply voltage sense (uncomment to enable, requires rev H9 or newer;
      # earlier revisions leave the divider unpopulated and the ADC pin floating)
      # - firmware/esphome/packages/monitoring-power.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      - firmware/esphome/packages/${ 'monitoring-eth' if enable_lan|string|lower == 'true' else 'empty' }.yaml
      # OLED display on the SPI bus - set `enable_oled` above to switch it on
      - firmware/esphome/packages/${ 'oled' if enable_oled|string|lower == 'true' else 'empty' }.yaml
      
      # Option A: @c-MM original port of esp32-snapclient client
      # Basic implementation without DSP controls
      - firmware/esphome/packages/snapclient-new.yaml
      - firmware/esphome/packages/snapclient-addon-external-dac.yaml
      - firmware/esphome/packages/snapclient-addon-dac-enable.yaml
      - firmware/esphome/packages/snapclient-addon-tas58xx.yaml
      # Option B: @farmed-switch fork of the c-MM snapclient with added DSP controls
      # Implements software BQ-filters, but makes less sense for DSP-enabled DACs like TAS58XX
      # - firmware/esphome/packages/snapclient-with-dsp.yaml
      
      # Ethernet (W5500), running alongside `wifi:` via the network priority list above.
      # Shares the SPI pins with the display, so `enable_lan` and the display
      # toggle are mutually exclusive - see the guard at the end of this block.
      - firmware/esphome/packages/${ 'ethernet-w5500' if enable_lan|string|lower == 'true' else 'empty' }.yaml
  # Guard: the W5500 and the OLED are wired to the same SPI pins on this
  # board (the W5500 drives clk/mosi/miso itself rather than sharing the
  # `spi:` component), so these two cannot both be on. Resolves to an empty
  # mapping unless both are, in which case the undefined variable aborts the
  # build naming the conflict.
  toggle_guard:
    ${ {} if not (enable_lan|string|lower == 'true' and enable_oled|string|lower == 'true')
          else error_enable_lan_and_enable_oled_both_true_they_share_the_spi_pins }
