# ============================================================
# Amped-ESP32-S3-Plus - Basic Media Player Configuration
# ============================================================
# ESP32-S3 audio board with PCM5122 DAC, I2S output
# Features: Wi-Fi media player, mixer/resampler speakers,
#           announcements, RGB LED, IR receiver, OLED display
# Board-specific pinouts are defined in substitutions section
# ============================================================

substitutions:
  name: amped-esp32s3-plus
  friendly_name: Amped-ESP32-S3-Plus
  task_stack_in_psram: "true"

  # ===== Optional Hardware Feature Toggles =====
  # Accepts true/false quoted or bare; anything that is not "true"
  # (case-insensitive) disables the feature. A disabled feature is not
  # merged at all, so it claims no GPIO and costs no flash.
  # See firmware/esphome/README.md for the full notes.
  enable_led: "true"    # WS2812 RGB LED on rgb_led_pin
  enable_ir: "true"     # IR receiver on ir_rx_pin
  enable_oled: "false"  # SH1106 OLED on the SPI pins

  # The git ref the feature packages below are pulled from. Set this to the
  # same ref you pinned this file at, so a pinned config gets matching
  # packages instead of whatever happens to be on main.
  sonocotta_ref: feat/222-hardware-feature-toggles

  # Board-specific pinout configuration
  # I2C pins
  i2c_sda_pin: GPIO18
  i2c_scl_pin: GPIO8
  pcm5122_i2c_address: 0x4D

  # I2S audio pins
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14
  i2s_dout_pin: GPIO16
  
  # Amp UNMUTE pin
  amp_enable_pin: GPIO17
  amp_enable_restore_mode: ALWAYS_ON

  # RGB LED
  rgb_led_pin: GPIO21
  
  # IR receiver
  ir_rx_pin: GPIO07

  # SPI pins (for display)
  spi_clk_pin: GPIO12
  spi_mosi_pin: GPIO11
  spi_miso_pin: GPIO13
  
  # Display control pins
  display_cs_pin: GPIO47
  display_dc_pin: GPIO38
  display_reset_pin: GPIO48

  # Ethernet pins (if using ethernet instead of wifi)
  eth_cs_pin: GPIO10
  eth_interrupt_pin: GPIO6
  eth_reset_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: ESP32S3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Optional for ESP32-Louder used by Voice-PE
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

logger:
  # Compiled with DEBUG so the "Log Level" select can raise it at runtime;
  # starts at INFO on every boot.
  level: DEBUG
  initial_level: INFO

api:
  # Don't reboot when no Home Assistant client is connected: players used
  # only with Music Assistant (Sendspin) never have one.
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

network:
  enable_ipv6: true

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: ${sonocotta_ref}
    files:
      - firmware/esphome/packages/dac-pcm5122.yaml
      - firmware/esphome/packages/amp-unmute.yaml
      - firmware/esphome/packages/audio.yaml
      - firmware/esphome/packages/audio-addon-external-dac.yaml
      - firmware/esphome/packages/${ 'media-player' if enable_led|string|lower == 'true' else 'media-player-no-light' }.yaml
      - firmware/esphome/packages/media-player-addon-dac-enable.yaml
      
      - firmware/esphome/packages/${ 'light' if enable_led|string|lower == 'true' else 'empty' }.yaml
      - firmware/esphome/packages/${ 'ir-receiver' if enable_ir|string|lower == 'true' else 'empty' }.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      # OLED display on the SPI bus - set `enable_oled` above to switch it on
      - firmware/esphome/packages/${ 'oled' if enable_oled|string|lower == 'true' else 'empty' }.yaml
      # Optional ethernet (replace wifi config if you use this, you need to exclude OLED package if you do this to free up SPI bus)
      # - firmware/esphome/packages/ethernet-w5500.yaml
