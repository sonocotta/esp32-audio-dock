# ============================================================
# Amped-ESP32 - Snapclient Configuration
# ============================================================
# ESP32 audio board with PCM5100 DAC (I2S) and TPA3110/TPA3128 AMP
# Configured as a Snapcast client for synchronized audio
# There are two implementations available:
# 1) Basic snapclient without DSP controls (c-MM original port)
# 2) snapclient with added DSP controls (farmed-switch fork of c-MM port)
#     Frequencies: 40, 50, 60, 70, 80, 90, 100, 110, 120, 130,
#                 140, 200, 315, 500, 800, 1250, 2000, 5000 Hz
#     Range: -15dB to +15dB per band
# Board-specific pinouts defined in substitutions
# Functional blocks imported from /packages
# ============================================================

substitutions:
  name: esphome-web-e480dc
  friendly_name: Amped-ESP32
  task_stack_in_psram: "false"

  # ===== Board-Specific Pinouts =====
  # I2S Audio (PCM5100 DAC)
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26
  i2s_dout_pin: GPIO22

  # Amp UNMUTE pin
  amp_enable_pin: GPIO13
  amp_enable_restore_mode: ALWAYS_OFF
  
  # RGB LED
  rgb_led_pin: GPIO12
  
  # IR Receiver
  ir_rx_pin: GPIO39

  # Ethernet (W5500)
  eth_cs_pin: GPIO05
  eth_interrupt_pin: GPIO35
  eth_reset_pin: GPIO14

  # SPI pins
  spi_clk_pin: GPIO18
  spi_mosi_pin: GPIO23
  spi_miso_pin: GPIO19
  
  # Display control pins
  display_cs_pin: GPIO15
  display_dc_pin: GPIO04
  display_reset_pin: GPIO32

  # ===== Snapcast Server Configuration =====
  snapcast_server_ip: "192.168.1.49"
  snapcast_server_port: "1704"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.1
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: esp32
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1" 
      sram1_as_iram: true
    sdkconfig_options:
      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: INFO

api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret esphome_wifi_ssid
  password: !secret esphome_wifi_password

psram:
  speed: 80MHz

network:
  enable_ipv6: true
  # Both `wifi:` and `ethernet:` are configured in this file. On the ESP32 family the two
  # stacks can run side by side, but then the priority list is mandatory (ESPHome 2026.8.1+).
  # It decides which interface is brought up first, whose IP is reported, and which one
  # carries the default route. Failover is automatic: unplug the cable and traffic moves
  # to Wi-Fi, plug it back in and Ethernet takes over again.
  priority:
    - ethernet
    - wifi

# ===== Packages =====
packages:
  esparagus_remote:
    url: https://github.com/sonocotta/esp32-audio-dock
    ref: main
    files:
      - firmware/esphome/packages/light.yaml
      - firmware/esphome/packages/ir-receiver.yaml
      - firmware/esphome/packages/monitoring.yaml
      - firmware/esphome/packages/monitoring-wifi.yaml
      - firmware/esphome/packages/monitoring-eth.yaml
      - firmware/esphome/packages/amp-unmute.yaml
      # Optional OLED display (uncomment to enable, requires SPI bus)
      # - firmware/esphome/packages/oled.yaml
      
      # Option A: @c-MM original port of esp32-snapclient client
      # Basic implementation without DSP controls
      - firmware/esphome/packages/snapclient-new.yaml
      - firmware/esphome/packages/snapclient-addon-amp-enable.yaml
      # Option B: @farmed-switch fork of the c-MM snapclient with added DSP controls
      # Implements software BQ-filters for basic DACs and controls hardware DSP for DSP-enabled DACs like TAS5805M
      # - firmware/esphome/packages/snapclient-with-dsp.yaml
      # Ethernet (W5500), running alongside `wifi:` via the network priority list above.
      # Shares the SPI pins with the display, so the display package must stay excluded.
      - firmware/esphome/packages/ethernet-w5500.yaml
