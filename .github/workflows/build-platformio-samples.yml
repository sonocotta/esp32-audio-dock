name: Build Examples

on:
  push:
    paths:
    - 'firmware/**'
    - '.github/workflows/build-platformio-samples.yml'
  pull_request:
    paths:
    - 'firmware/**'
    - '.github/workflows/build-platformio-samples.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        example:
          - ./firmware/esp32-i2s-bare
          - ./firmware/esp32-i2s-esp8266audio
          - ./firmware/esp32-i2s-web-radio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
    
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio intelhex
          
      - name: Build examples
        run: |
          pio run -d ${{ matrix.example }}
